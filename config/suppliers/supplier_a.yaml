supplier_id: "SUP-A"
supplier_name: "Supplier Alpha"
priority_rank: 1
trust_weight: 0.95
file_pattern: "*supplier_a*.csv"
format: "csv"
delimiter: ","
encoding: "utf-8"
decimal_separator: "."
required_columns:
  - "sku"
  - "product_name"
  - "cat_code"
  - "price"
  - "weight_lb"
  - "color_code"
  - "updated_at"
  - "stock_qty"
  - "country"
optional_columns:
  - "gtin"
column_mapping:
  sku: "supplier_sku"
  product_name: "name_raw"
  cat_code: "category_code_raw"
  price: "price_raw"
  weight_lb: "weight_raw"
  color_code: "color_code_raw"
  updated_at: "updated_at_raw"
  stock_qty: "stock_qty_raw"
  country: "country_raw"
  gtin: "gtin_raw"
default_currency: "USD"
default_weight_unit: "lb"
date_format: "iso8601"
