supplier_id: "SUP-C"
supplier_name: "Supplier Gamma"
priority_rank: 3
trust_weight: 0.75
file_pattern: "*supplier_c*.csv"
format: "csv"
delimiter: ";"
decimal_separator: ","
encoding: "iso-8859-1"
required_columns:
  - "art_nr"
  - "bezeichnung"
  - "warengruppe"
  - "preis_eur"
  - "gewicht_kg"
  - "farbe"
  - "stand"
  - "lager"
  - "herkunft"
optional_columns:
  - "gtin"
column_mapping:
  art_nr: "supplier_sku"
  bezeichnung: "name_raw"
  warengruppe: "category_code_raw"
  preis_eur: "price_raw"
  gewicht_kg: "weight_raw"
  farbe: "color_code_raw"
  stand: "updated_at_raw"
  lager: "stock_qty_raw"
  herkunft: "country_raw"
  gtin: "gtin_raw"
default_currency: "EUR"
default_weight_unit: "kg"
date_format: "dd.mm.yyyy"
